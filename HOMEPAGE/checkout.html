<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
FarmNest | Checkout
</title>



<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>



<body>



<!-- ================= HEADER ================= -->


<header class="header">


<div class="logo">

<i class="fa-solid fa-seedling"></i>

FarmNest

</div>



<nav>


<a href="index.html">
Home
</a>


<a href="products.html">
Products
</a>


<a href="cart.html">
Cart
</a>


<a href="checkout.html" class="active">
Checkout
</a>


<a href="about.html">
About
</a>


</nav>




<div class="header-icons">


<i class="fa-solid fa-cart-shopping"></i>


<i class="fa-solid fa-user"></i>


</div>



</header>








<!-- ================= CHECKOUT HERO ================= -->


<section class="checkout-hero">


<h1>
Complete Your Order 🛒
</h1>


<p>
Fresh products delivered from farmers to your home.
</p>


</section>









<!-- ================= CHECKOUT SECTION ================= -->


<section class="checkout-section">





<!-- CUSTOMER FORM -->


<div class="checkout-form">


<h2>
Delivery Details
</h2>



<form id="checkoutForm">



<input 
type="text"
placeholder="Full Name"
required>




<input 
type="email"
placeholder="Email Address"
required>





<input 
type="tel"
placeholder="Phone Number"
required>






<textarea 
placeholder="Full Delivery Address"
required></textarea>







<h3>
Payment Method
</h3>




<label>

<input type="radio" name="payment" checked>

Cash On Delivery

</label>



<label>

<input type="radio" name="payment">

UPI Payment

</label>



<label>

<input type="radio" name="payment">

Card Payment

</label>







<button type="submit">

Place Order

</button>



</form>



</div>








<!-- ORDER SUMMARY -->


<div class="order-summary">


<h2>
Order Summary
</h2>


<div id="checkoutItems">

</div>



<hr>



<h3>

Total:
<span id="checkoutTotal">
₹0
</span>

</h3>



</div>






</section>









<!-- ================= SUCCESS ================= -->


<div id="orderSuccess">


<i class="fa-solid fa-circle-check"></i>


<h2>
Order Placed Successfully 🎉
</h2>


<p>
Thank you for supporting farmers.
</p>



</div>









<footer>


<p>

© 2026 FarmNest | Fresh From Farmers To Your Home

</p>


</footer>




<script src="../JS/script.js"></script>


</body>


</html>
