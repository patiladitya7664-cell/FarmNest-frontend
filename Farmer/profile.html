    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="main">

      <!-- =========================================
     PREMIUM FARMER PROFILE HEADER
========================================= -->



      <!-- =========================================
           PROFILE CONTENT
      ========================================== -->

      <div class="profile-page">


        <!-- PROFILE CARD -->

        <section class="profile-card">

          <div class="profile-image-section">

  <img
    id="profileImage"
    class="profile-image"
    src="../images/farmer.png"
    alt="Farmer Profile"
  />

  <label for="profileUpload" class="upload-btn">
    <i class="fa fa-camera"></i>
    Change Photo
  </label>

  <input
    type="file"
    id="profileUpload"
    accept="image/*"
    hidden
  />

</div>

          <h2>Aditya Farmer</h2>

          <p>FarmNest Farmer</p>

          <span class="farmer-badge">
            <i class="fa fa-check-circle"></i>
            Verified Farmer
          </span>

          <div class="account-info">

            <div class="info-box">

              <i class="fa fa-seedling"></i>

              <h4>25</h4>

              <p>Total Crops</p>

            </div>

            <div class="info-box">

              <i class="fa fa-box"></i>

              <h4>120</h4>

              <p>Products</p>

            </div>

            <div class="info-box">

              <i class="fa fa-shopping-cart"></i>

              <h4>45</h4>

              <p>Orders</p>

            </div>

          </div>

        </section>


        <!-- PROFILE DETAILS -->

        <section class="profile-details">

          <h2>
            <i class="fa fa-user"></i>
            Personal Information
          </h2>


          <form id="profileForm">

            <div class="form-grid">


              <!-- NAME -->

              <div class="form-group">

                <label for="name">
                  Full Name
                </label>

                <input
                  type="text"
                  id="name"
                  value="Aditya Farmer"
                  required
                />

              </div>


              <!-- EMAIL -->

              <div class="form-group">

                <label for="email">
                  Email Address
                </label>

                <input
                  type="email"
                  id="email"
                  value="farmer@farmnest.com"
                  required
                />

              </div>


              <!-- PHONE -->

              <div class="form-group">

                <label for="phone">
                  Mobile Number
                </label>

                <input
                  type="tel"
                  id="phone"
                  value="+91 9876543210"
                  required
                />

              </div>


              <!-- FARM NAME -->

              <div class="form-group">

                <label for="farmName">
                  Farm Name
                </label>

                <input
                  type="text"
                  id="farmName"
                  value="Aditya Farm"
                />

              </div>


              <!-- LOCATION -->

              <div class="form-group">

                <label for="location">
                  Location
                </label>

                <input
                  type="text"
                  id="location"
                  value="Maharashtra, India"
                />

              </div>


              <!-- FARM SIZE -->

              <div class="form-group">

                <label for="farmSize">
                  Farm Size
                </label>

                <input
                  type="text"
                  id="farmSize"
                  value="5 Acres"
                />

              </div>


              <!-- ADDRESS -->

              <div class="form-group full">

                <label for="address">
                  Farm Address
                </label>

                <textarea id="address">
Maharashtra, India</textarea>

              </div>


              <!-- BIO -->

              <div class="form-group full">

                <label for="bio">
                  About Farmer
                </label>

                <textarea id="bio">
I am a farmer registered with FarmNest. I provide fresh and quality farm products directly to customers.</textarea>

              </div>

            </div>


            <!-- ACTIONS -->

            <div class="profile-actions">

              <button
                type="submit"
                class="save-btn"
              >
                <i class="fa fa-save"></i>
                Save Changes
              </button>

              <button
                type="reset"
                class="cancel-btn"
              >
                <i class="fa fa-rotate-left"></i>
                Reset
              </button>

            </div>

          </form>

        </section>

      </div>

    </div>


    <!-- =========================================

    <script src="../js/farmer-profile.js"></script>
