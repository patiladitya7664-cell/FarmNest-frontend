<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
FarmNest | Register
</title>


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>


<body>



<!-- ================= HEADER ================= -->


<header class="header">


<div class="logo">

<i class="fa-solid fa-seedling"></i>

FarmNest

</div>


<nav>


<a href="index.html">
Home
</a>


<a href="products.html">
Products
</a>


<a href="login.html">
Login
</a>


<a href="register.html" class="active">
Register
</a>


</nav>


</header>







<!-- ================= REGISTER SECTION ================= -->


<section class="auth-section">



<div class="auth-box">



<div class="auth-image">


<img src="images/farmer-register.jpg">


</div>






<div class="auth-form">


<h1>
Create Account 🌱
</h1>


<p>
Join FarmNest community today
</p>





<form id="registerForm">



<input 
type="text"
id="regName"
placeholder="Full Name"
required>




<input 
type="email"
id="regEmail"
placeholder="Email Address"
required>





<input 
type="tel"
id="regPhone"
placeholder="Phone Number"
required>







<select id="userType">


<option value="customer">

Customer

</option>


<option value="farmer">

Farmer

</option>


</select>







<div id="farmerDetails">


<input

type="text"

placeholder="Farm Name">


<input

type="text"

placeholder="Crop Type">


</div>








<input

type="password"

id="regPassword"

placeholder="Password"

required>






<button type="submit">

Create Account

</button>




</form>





<p>

Already have account?

<a href="login.html">
Login
</a>

</p>




</div>


</div>


</section>









<footer>


<p>

© 2026 FarmNest | Fresh From Farmers To Your Home

</p>


</footer>





<script src="../js/script.js"></script>


</body>

</html>
