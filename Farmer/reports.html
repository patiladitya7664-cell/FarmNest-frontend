<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reports | FarmNest</title>


    <!-- COMMON FARMNEST CSS -->

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/header.css">


    <!-- REPORT CSS -->

    <link rel="stylesheet"
          href="../css/report.css">


    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<!-- =====================================================
     COMMON FARMNEST HEADER
===================================================== -->

<div id="header"></div>



<!-- =====================================================
     REPORT PAGE
===================================================== -->

<main class="report-page">


    <section class="report-header">

        <h1>
            Reports
        </h1>

        <p>
            View and manage your FarmNest farming reports
        </p>

    </section>


    <!-- REPORT CONTENT -->

    <section class="reports-container">


        <div class="report-card">

            <i class="fa-solid fa-chart-line"></i>

            <h2>
                Sales Report
            </h2>

            <p>
                View your product sales and earnings.
            </p>

            <button>
                View Report
            </button>

        </div>



        <div class="report-card">

            <i class="fa-solid fa-box"></i>

            <h2>
                Product Report
            </h2>

            <p>
                Check your products and inventory details.
            </p>

            <button>
                View Report
            </button>

        </div>



        <div class="report-card">

            <i class="fa-solid fa-warehouse"></i>

            <h2>
                Storage Report
            </h2>

            <p>
                Check warehouse and storage information.
            </p>

            <button>
                View Report
            </button>

        </div>



        <div class="report-card">

            <i class="fa-solid fa-indian-rupee-sign"></i>

            <h2>
                Earnings Report
            </h2>

            <p>
                View your total earnings and transactions.
            </p>

            <button>
                View Report
            </button>

        </div>


    </section>


</main>



<!-- =====================================================
     COMMON HEADER JAVASCRIPT
===================================================== -->

<script src="../js/header.js"></script>


<!-- REPORT JAVASCRIPT -->

<script src="../ADMIN/jss/report.js"></script>


</body>

</html>
