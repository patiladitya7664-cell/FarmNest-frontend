<header class="header">

<!-- ================= LOGIN SECTION ================= -->


<section class="auth-section">





<div class="auth-box">





<!-- IMAGE -->


<div class="auth-image">


<img src="images/web-logo/farmnest-logo.png">


</div>









<!-- FORM -->


<div class="auth-form">



<h1>

Welcome Back 🌱

</h1>



<p>

Login to continue with FarmNest

</p>







<form id="loginForm">





<input 

type="email"

id="loginEmail"

placeholder="Email Address"

required>









<div class="password-box">


<input 

type="password"

id="loginPassword"

placeholder="Password"

required>



<i 

class="fa-solid fa-eye"

id="showPassword">

</i>


</div>








<label class="remember">


<input 

type="checkbox"

id="remember">


Remember Me


</label>







<button type="submit">

Login

</button>







<p>

Don't have account?


<a href="../register.html">

Register

</a>


</p>






</form>



</div>







</div>





</section>
